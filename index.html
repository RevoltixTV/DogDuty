${real?'<div class="card"><h2 style="font-size:17px">Feedback</h2><div class="list" style="margin-top:4px">'+row('Feedback & Verbesserungsvorschläge','','fbgo')+'</div></div>':''}`)},
group:()=>{const X=cur(),d=X.dog;
 return shell('group',`<div class="row sp"><h1>${esc(X.grp.n)}</h1><a href="#/settings" aria-label="Einstellungen" style="font-size:26px;display:grid;place-items:center;width:44px;height:44px;color:var(--fg)">${ic('gear')}</a></div>${d?`<div class="card row" style="gap:16px"><span class="av" style="width:64px;height:64px;background:var(--ink);color:var(--fg)">${PAW}</span><div class="grow"><p class="b" style="font-size:20px">${esc(d.n)}</p><p class="mute sm">${esc([d.breed,d.age].filter(Boolean).join(' · ')||'Keine weiteren Angaben')}</p></div>${X.admin?'<a class="leaf b sm" href="#/dog">Bearbeiten</a>':''}</div>`:X.admin?'<a class="btn ghost" href="#/dog">Hund hinzufügen</a>':'<p class="card mute">Noch kein Hund angelegt.</p>'}
<div class="card stack" style="gap:12px"><p class="mute sm">Einladungscode</p><div class="row sp"><p class="b" style="font-size:24px;letter-spacing:.1em">${esc(X.grp.code)}</p><button class="btn ghost auto sm" style="padding:8px 16px" data-a="copy">${S.copied?'Kopiert':'Kopieren'}</button></div><button class="btn" data-a="share">Mitglieder einladen</button></div>
<div class="card"><h2 style="font-size:17px">Mitglieder</h2><div class="list" style="margin-top:8px">${X.members.map(m=>`<div class="row" style="padding:12px 0"><span class="av" style="background:${m.c}">${esc(m[ 'n'][0])}</span><span class="grow b">${esc(m.n)}${m.id==X.me?' (du)':''}</span><span class="mute sm">${m.r}</span></div>`).join('')}</div></div>
${donCard()}${ownerCard()}${notifCard()}${isDemo()?'<a class="btn ghost" href="#/" data-a="enddemo">Demo beenden</a>':'<button class="mute sm" data-a="logout" style="background:none;border:0;padding:8px;cursor:pointer">Abmelden</button>'}<div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px;text-align:center"><p class="b">DogDuty</p><p class="mute sm">Version ${APP_VERSION}</p></div>`)}
};
const go=h=>{location.hash=h};
function render(keep){const nv=document.getElementById('nav');nv.hidden=true;S.navOn=null;const A=document.getElementById('app'),k=(location.hash||'#/').slice(2),load=m=>{A.innerHTML=center(`<p class="mute" style="text-align:center">${m}</p>`)};
 if(!S.ready)return load('Lädt …');
 if(k!=S.lk){S.err='';S.lk=k;if(k!='feedback')S.fbDone=false}
 if(S.user&&['','login','register'].includes(k))return go(S.profile.groupId?'#/home':'#/setup');
 if(k=='owner'){if(!S.user||S.profile.role!='owner')return go(S.user?'#/home':'#/login');if(!S.stats&&!S.sl)setTimeout(loadStats,0);if(!S.fbl)setTimeout(loadFb,0)}
 else if(k=='settings'||k=='feedback'||k=='receipts'){if(!S.user&&!(S.demo&&k!='feedback'))return go(S.demo?'#/home':'#/login');if(k=='receipts'&&!S.rcp)setTimeout(loadRcp,0)}
 else if(['home','calendar','walk','group','dog','setup'].includes(k)){
  if(!S.user&&!S.demo)return go('#/login');
  if(S.user){if(!S.profile.groupId&&k!='setup')return go('#/setup');if(S.profile.groupId&&k=='setup')return go('#/home');
   if(S.profile.groupId&&!S.gl)return load('Gruppe wird geladen …');
   if(S.profile.groupId&&(S.gerr||!cur())){A.innerHTML=center(`<p>${esc(S.gerr||'Gruppe konnte nicht geladen werden.')}</p><button class="btn ghost" data-a="logout">Abmelden</button>`);return}}
  else if(k=='setup')return go('#/home')}
 A.innerHTML=(R[k]||R[''])()+(S.upd?updModal():'')+dlg();if(S.navOn){nv.innerHTML=navHtml(S.navOn);nv.hidden=false}if(!keep)scrollTo(0,0)}

document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
 try{const X=cur(),nx=X&&X.walks.find(w=>w.s!='erledigt'&&w.d>=iso());
 switch(a){
 case'closeupd':try{localStorage.setItem('dd_seen',APP_VERSION)}catch(e){}S.upd=false;break;case'notif':await enablePush();break;
 case'delask':S.dlg='delete';S.derr='';break;case'leaveask':S.dlg='leave';S.derr='';break;case'dlgclose':S.dlg=null;break;case'rename':S.rn=!S.rn;break;case'log':S.log=!S.log;break;
 case'leaveok':try{await leaveGroup();S.dlg=null;go('#/setup')}catch(x){console.error(x);S.derr=msg(x)}break;
 case'theme':setPref(v,getPref().mode);break;case'mode':setPref(getPref().theme,v);break;case'rcpgo':go('#/receipts');break;case'pinfo':S.pinfo=!S.pinfo;break;
 case'premium':S.dlg='premium';S.pdone=false;S.derr='';break;
 case'pvorm':if(!isDemo())await updateDoc(doc(db,'users',S.user.uid),{premiumInterest:true,premiumInterestAt:serverTimestamp()});S.pdone=true;break;
 case'verify':await sendEmailVerification(auth.currentUser);toast('Bestätigungs-E-Mail gesendet. Öffne den Link und tippe dann auf „Ich habe bestätigt“.');break;
 case'recheck':await reload(auth.currentUser);await auth.currentUser.getIdToken(true);await promote(auth.currentUser);break;
 case'refresh':S.stats=null;S.fbl=null;loadStats();loadFb();return;
 case'google':case'apple':return AUTH.social(a);
 case'logout':return AUTH.logout();
 case'demo':if(!S.user)S.demo=mkDemo();return;
 case'enddemo':S.demo=null;go('#/');return;
 case'tab':S.tab=v;break;case'view':S.view=v;break;case'day':S.sel=v;break;case'wk':S.wk+=+v;S.sel=isoAdd(S.sel,7*(+v));break;case'rep':S.rep=v;break;case'sw':S.sw=v;break;case'send':await serEnd(v);S.sed=null;break;case'fbgo':go('#/feedback');break;case'fbreset':S.fbDone=false;break;
 case'sedit':S.sed=S.sed==v?null:v;{const sr=X.series.find(x=>x.id==v);if(sr){S.et=sr.t;S.sw=sr.who||''}}break;
 case'plan':S.plan=!S.plan;break;case'goplan':S.plan=true;S.wk=0;S.sel=iso();go('#/calendar');break;
 case'pw':S.pw=v;break;case'pl':S.pl=v;S.pt=TIMES[v];break;
 case'dur':S.dur=v;break;case'pee':S.pee=!S.pee;break;case'poop':S.poop=!S.poop;break;
 case'go':if(nx)await upd(nx.id,{who:X.me,s:'uebernommen'});break;
 case'cant':if(nx)await upd(nx.id,{who:null,s:'offen'});break;
 case'take':await upd(v,{who:X.me,s:'uebernommen'});break;
 case'free':await upd(v,{who:null,s:'offen'});break;
 case'save':{const w=X.walks.find(w=>w.who==X.me&&w.s!='erledigt'&&w.d<=iso());if(w)await upd(w.id,{s:'erledigt',pee:+S.pee,poop:+S.poop,dur:S.dur,note:S.note,doneBy:X.me,...(isDemo()?{}:{doneAt:serverTimestamp()})});S.pee=S.poop=false;S.note='';go('#/home');break}
 case'copy':navigator.clipboard?.writeText(X.grp.code).catch(()=>{});S.copied=true;setTimeout(()=>{S.copied=false;render(1)},1800);break;
 case'share':{const x=`Tritt unserer DogDuty-Gruppe „${X.grp.n}“ bei. Einladungscode: ${X.grp.code}\n${location.origin}${location.pathname}`;if(navigator.share)navigator.share({text:x}).catch(()=>{});else{navigator.clipboard?.writeText(x).catch(()=>{});S.copied=true;setTimeout(()=>{S.copied=false;render(1)},1800)}break}
 }}catch(x){console.error(x);S.err=msg(x)}
 render(1)});
document.addEventListener('input',e=>{if(e.target.id=='note')S.note=e.target.value;if(e.target.id=='fb')S.fb=e.target.value});
document.addEventListener('change',e=>{const n=e.target.name||'',f=e.target.form;if(n=='th'||n=='tm')S.pt=f.elements.th.value+':'+f.elements.tm.value;if(n=='the'||n=='tme')S.et=f.elements.the.value+':'+f.elements.tme.value});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target.dataset.f,d=new FormData(e.target);S.err='';
 try{
 if(f=='authl'||f=='authr')return AUTH.email(f=='authr',d.get('n'),d.get('e'),d.get('p'));
 if(f=='setup'){if(S.tab=='new'){await createGroup(d.get('g').trim());go('#/dog')}else{await joinGroup(d.get('c'));go('#/home')}return}
 if(f=='dog'){await saveDog({n:d.get('n').trim(),age:d.get('a').trim(),breed:d.get('b').trim()});go('#/home');return}
 if(f=='rename'){await saveName(d.get('g').trim());S.rn=false}
 if(f=='delacc'){try{await deleteAccount(d.get('pw'));S.dlg=null;go('#/')}catch(x){console.error(x);S.derr=msg(x)}}
 if(f=='don'){const a=parseFloat(String(d.get('a')).replace(/\./g,'').replace(',','.'));if(isNaN(a)||a<0)throw{code:'dd/num'};await setDoc(doc(db,'transparency','donations'),{amount:a,month:iso().slice(0,7),updatedAt:serverTimestamp()});toast('Betrag gespeichert.')}
 if(f=='rcp'){const u=d.get('u').trim();if(!/^https:\/\//.test(u))throw{code:'dd/url'};await addDoc(collection(db,'receipts'),{title:d.get('t').trim(),url:u,createdAt:serverTimestamp()});S.rcp=null;toast('Beleg hinzugefügt.')}
 if(f=='sedit'){await serEdit(S.sed,d.get('the')+':'+d.get('tme'),S.sw);S.sed=null}
 if(f=='fb'){const m=d.get('m').trim();if(m){await addDoc(collection(db,'feedback'),{uid:S.user.uid,name:S.profile.name||'Nutzer',message:m,createdAt:serverTimestamp()});S.fb='';S.fbDone=true}}
 if(f=='plan'){const X=cur(),who=S.pw=='me'?X.me:S.pw||null,t=d.get('th')+':'+d.get('tm');S.pt=t;
  if(S.rep=='week'){await serAdd({l:S.pl,t,wd:wdOf(S.sel),who,active:true,start:S.sel});await genSeries()}
  else await addWalk({l:S.pl,t,d:S.sel,who,s:who?'geplant':'offen'});
  S.plan=false;S.rep='once'}
 }catch(x){console.error(x);S.err=msg(x)}
 render(1)});
addEventListener('hashchange',()=>render());setInterval(tick,30000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v='+APP_VERSION).catch(()=>{}));
setTimeout(()=>{if(!S.ready){S.ready=true;S.err='Der Anmeldedienst ist nicht erreichbar.';render()}},8000);

</script></body></html>
