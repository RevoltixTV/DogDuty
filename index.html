<style>

button,input,textarea{font:inherit;color:inherit}
h1,h2,p{margin:0}
.wrap{max-width:440px;margin:0 auto;padding:28px 20px 110px}

.btn:active{transform:scale(.98)}

a.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
.input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 16px;outline-offset:0}
.input:focus{border-color:var(--leaf)}

.chip.on{background:var(--leaf);color:var(--ink);border-color:var(--leaf)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px}
.tabs button{border:0;background:none;border-radius:14px;padding:11px;font-weight:700;color:var(--mute);cursor:pointer}
.tabs button.on{background:var(--leaf);color:var(--ink)}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.logo svg{width:24px;height:24px}
.av{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;font-weight:800;color:var(--ink);flex-shrink:0}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.offen{color:var(--amber);border-color:#F5C76B66}.pill.uebernommen{color:var(--leaf);border-color:#8FE3A080}.pill.erledigt{background:var(--leaf);color:var(--ink);border-color:var(--leaf)}

nav.bar div{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.bar a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;font-size:12px;font-weight:600;color:var(--mute);text-decoration:none}
nav.bar a.on{color:var(--leaf)}nav.bar svg{width:24px;height:24px}
.hero{display:grid;gap:48px;align-items:center;padding:56px 0 72px}
.hero h1{font-size:clamp(40px,8vw,64px);line-height:1.05}
.feat{display:grid;gap:16px;padding-bottom:80px}
@media(min-width:760px){.hero{grid-template-columns:1fr 1fr}.feat{grid-template-columns:repeat(3,1fr)}}
.list>*+*{border-top:1px solid var(--line)}
.sep{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:14px}.sep:before,.sep:after{content:"";height:1px;flex:1;background:var(--line)}
.dayrow{display:flex;flex-wrap:wrap;gap:8px}.ic{width:1.2em;height:1.2em;flex-shrink:0}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}.av svg{width:55%;height:55%}
</style></head>

 return `<div class="card stack" style="gap:12px"><h2 style="font-size:17px">Benachrichtigungen</h2><p class="mute sm">${tx}</p>${st=='default'?'<button class="btn" data-a="notif">Benachrichtigungen aktivieren</button>':''}</div>`};

 members:[['tim','Tim','Admin'],['lena','Lena','Admin'],['noah','Noah','Mitglied']].map(([id,n,r],i)=>({id,n,r,c:COL[i]})),
 walks:[['Morgenrunde','07:30',0,'lena','erledigt',1,1],['Mittagsrunde','13:15',0,'noah','erledigt',1,0],['Abendrunde','18:00',0,'tim','uebernommen'],['Nachtrunde','21:30',0,null,'offen'],['Morgenrunde','07:30',1,'tim','geplant'],['Abendrunde','18:30',1,'lena','geplant']].map(([l,t,o,who,s,pee,poop],i)=>({id:i+1,l,t,d:iso(o),who,s,pee,poop}))});

 return{grp:{n:g.name,code:g.code},dog:g.dog||null,me:S.user.uid,admin:g.members[S.user.uid]?.role=='Admin',walks:S.walks,

IC.owner='M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z';

const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
let pend=null,unsub=[];

const gid=()=>S.profile.groupId;

const soft=()=>{const el=document.activeElement;if(el&&/INPUT|TEXTAREA/.test(el.tagName))return;render(1)};
async function sync(u){const ref=doc(db,'users',u.uid),s=await getDoc(ref);
 if(s.exists()){const d=s.data();await updateDoc(ref,{lastLogin:serverTimestamp(),...(d.role?{}:{role:'user'})});return{groupId:null,...d,role:d.role||'user'}}
 const d={uid:u.uid,name:pend||u.displayName||(u.email||'').split('@')[0]||'Nutzer',email:u.email||'',provider:PV[u.providerData[0]?.providerId]||'email',createdAt:serverTimestamp(),lastLogin:serverTimestamp(),groupId:null,role:'user'};
 await setDoc(ref,d);return d}

 unsub.push(onSnapshot(doc(db,'groups',id),s=>{S.group=s.exists()?s.data():null;S.gerr=s.exists()?'':'Diese Gruppe existiert nicht mehr.';S.gl=true;soft()},()=>{S.gerr='Kein Zugriff auf die Gruppe.';S.gl=true;soft()}));

async function createGroup(name){const u=S.user,g=doc(collection(db,'groups')),code=mkCode();

function toast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');el.style.cssText='position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:30;max-width:440px;margin:0 auto;background:var(--card);border:1px solid var(--leaf);border-radius:18px;padding:14px 16px';document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,7000)}

function events(oldL,nw){const me=S.user?.uid,g=S.group,dn=g?.dog?.n||'deinem Hund',n=id=>g?.members?.[id]?.name||'Jemand',om=new Map(oldL.map(w=>[w.id,w]));

 for(const w of X.walks){if(w.who!=X.me||w.s=='erledigt'||w.d!=t)continue;
